name: Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - "@serve-tools/client-context"
          - "@serve-tools/client-db"
          - "@serve-tools/client-http-stream"
          - "@serve-tools/client-input"
          - "@serve-tools/client-interaction"
          - "@serve-tools/client-keyboard"
          - "@serve-tools/client-messaging"
          - "@serve-tools/client-realtime"
          - "@serve-tools/client-shared-db"
          - "@serve-tools/client-shared-http-stream"
          - "@serve-tools/client-shared-websocket"
          - "@serve-tools/client-shared-webtransport"
          - "@serve-tools/client-storage"
          - "@serve-tools/client-websocket"
          - "@serve-tools/client-webtransport"
          - "@serve-tools/client"
          - "@serve-tools/client-signals"
          - "@serve-tools/lit-signals"
          - "@serve-tools/polyfill-arraybuffer-base64"
          - "@serve-tools/polyfill-request-idle-callback"
          - "@serve-tools/polyfill-resource-management"
          - "@serve-tools/ponyfill-arraybuffer-base64"
          - "@serve-tools/ponyfill-request-idle-callback"
          - "@serve-tools/ponyfill-resource-management"
          - "@serve-tools/realtime-protocol"
          - "@serve-tools/server-http-stream"
          - "@serve-tools/server-realtime"
          - "@serve-tools/server-websocket"
          - "@serve-tools/server-webtransport"
          - "@serve-tools/signal-collections"
          - "@serve-tools/signal-db"
          - "@serve-tools/signal-dom"
          - "@serve-tools/signal-effect"
          - "@serve-tools/signal-event-target"
          - "@serve-tools/signal-http-stream"
          - "@serve-tools/signal-messaging"
          - "@serve-tools/signal-shared-db"
          - "@serve-tools/signal-shared-http-stream"
          - "@serve-tools/signal-shared-websocket"
          - "@serve-tools/signal-shared-webtransport"
          - "@serve-tools/signal-storage"
          - "@serve-tools/signal-websocket"
          - "@serve-tools/signal-webtransport"
          - "@serve-tools/signal"
          - "@serve-tools/skills"
          - "@serve-tools/vite-polyfills"
      version:
        description: Exact package.json version to confirm
        required: true
        type: string
      tag:
        description: npm distribution tag
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify and pack
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact: ${{ steps.package.outputs.artifact }}
      name: ${{ steps.package.outputs.name }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/
      - run: npm install --global npm@12.0.2
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run verify
      - id: package
        name: Resolve package
        env:
          RELEASE_PACKAGE: ${{ inputs.package }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node <<'NODE'
          const { appendFileSync } = require("node:fs");
          const { execFileSync } = require("node:child_process");
          const packages = JSON.parse(execFileSync("npm", ["query", ".workspace"], { encoding: "utf8" }));
          const packageData = packages.find(({ name, private: isPrivate }) => name === process.env.RELEASE_PACKAGE && !isPrivate);
          if (!packageData) throw new Error(`Unknown publishable package: ${process.env.RELEASE_PACKAGE}`);
          if (packageData.version !== process.env.RELEASE_VERSION) {
            throw new Error(`Expected ${packageData.name}@${packageData.version}, received ${process.env.RELEASE_VERSION}`);
          }
          const artifact = `${packageData.name.slice(1).replace("/", "-")}-${packageData.version}`;
          appendFileSync(process.env.GITHUB_OUTPUT, `artifact=${artifact}\nname=${packageData.name}\npath=${packageData.location}\nversion=${packageData.version}\n`);
          NODE
      - name: Check release prerequisites
        env:
          RELEASE_PACKAGE: ${{ steps.package.outputs.name }}
          RELEASE_PATH: ${{ steps.package.outputs.path }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          node <<'NODE'
          const { readFileSync } = require("node:fs");
          const { execFileSync } = require("node:child_process");
          const manifest = JSON.parse(readFileSync(`${process.env.RELEASE_PATH}/package.json`));
          const dependencies = { ...manifest.dependencies, ...manifest.optionalDependencies, ...manifest.peerDependencies };
          for (const [name, range] of Object.entries(dependencies)) {
            if (name.startsWith("@serve-tools/")) execFileSync("npm", ["view", `${name}@${range}`, "version", "--json"], { stdio: "inherit" });
          }
          NODE
          if npm view "$RELEASE_PACKAGE@$RELEASE_VERSION" version --json >/dev/null 2>&1; then
            echo "::error::$RELEASE_PACKAGE@$RELEASE_VERSION is already published"
            exit 1
          fi
      - id: pack
        name: Pack release artifact
        env:
          RELEASE_PATH: ${{ steps.package.outputs.path }}
        run: |
          PACK_RESULT=$(npm pack "$GITHUB_WORKSPACE/$RELEASE_PATH" --pack-destination "$RUNNER_TEMP" --json)
          TARBALL=$(printf '%s' "$PACK_RESULT" | node -e 'const result = JSON.parse(require("node:fs").readFileSync(0, "utf8")); console.log((Array.isArray(result) ? result[0] : Object.values(result)[0]).filename)')
          cd "$RUNNER_TEMP"
          sha256sum "$TARBALL" > "$TARBALL.sha256"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: |
            ${{ runner.temp }}/${{ steps.pack.outputs.tarball }}
            ${{ runner.temp }}/${{ steps.pack.outputs.tarball }}.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    name: Publish ${{ needs.prepare.outputs.name }}@${{ needs.prepare.outputs.version }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/
      - run: npm install --global npm@12.0.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: ${{ runner.temp }}/release
      - name: Verify and publish artifact
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          cd "$RUNNER_TEMP/release"
          sha256sum --check *.sha256
          TARBALL=$(find . -maxdepth 1 -type f -name '*.tgz' -print -quit)
          test -n "$TARBALL"
          npm publish "$TARBALL" --access public --tag "$RELEASE_TAG"
