name: Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish, or all prepared packages
        required: true
        type: choice
        options:
          - "all"
          - "@serve-tools/async-operation"
          - "@serve-tools/aui"
          - "@serve-tools/client-context"
          - "@serve-tools/client-db"
          - "@serve-tools/client-dom-fragment"
          - "@serve-tools/client-event-source"
          - "@serve-tools/client-http-stream"
          - "@serve-tools/client-input"
          - "@serve-tools/client-interaction"
          - "@serve-tools/client-keyboard"
          - "@serve-tools/client-messaging"
          - "@serve-tools/client-realtime"
          - "@serve-tools/client-router"
          - "@serve-tools/client-shared-db"
          - "@serve-tools/client-shared-event-source"
          - "@serve-tools/client-shared-http-stream"
          - "@serve-tools/client-shared-websocket"
          - "@serve-tools/client-shared-webtransport"
          - "@serve-tools/client-storage"
          - "@serve-tools/client-websocket"
          - "@serve-tools/client-webtransport"
          - "@serve-tools/client"
          - "@serve-tools/client-signals"
          - "@serve-tools/http-contract"
          - "@serve-tools/lit-signals"
          - "@serve-tools/polyfill-arraybuffer-base64"
          - "@serve-tools/polyfill-decorator-metadata"
          - "@serve-tools/polyfill-prioritized-task-scheduling"
          - "@serve-tools/polyfill-request-idle-callback"
          - "@serve-tools/polyfill-report-error"
          - "@serve-tools/polyfill-resource-management"
          - "@serve-tools/polyfill-urlpattern"
          - "@serve-tools/ponyfill-arraybuffer-base64"
          - "@serve-tools/ponyfill-composites"
          - "@serve-tools/ponyfill-decorator-metadata"
          - "@serve-tools/ponyfill-observable"
          - "@serve-tools/ponyfill-prioritized-task-scheduling"
          - "@serve-tools/ponyfill-request-idle-callback"
          - "@serve-tools/ponyfill-report-error"
          - "@serve-tools/ponyfill-resource-management"
          - "@serve-tools/ponyfill-urlpattern"
          - "@serve-tools/realtime-protocol"
          - "@serve-tools/rolldown-decorators"
          - "@serve-tools/router"
          - "@serve-tools/server-http-stream"
          - "@serve-tools/server-event-source"
          - "@serve-tools/server-realtime"
          - "@serve-tools/server-websocket"
          - "@serve-tools/server-webtransport"
          - "@serve-tools/signal-collections"
          - "@serve-tools/signal-db"
          - "@serve-tools/signal-dom"
          - "@serve-tools/signal-effect"
          - "@serve-tools/signal-event-target"
          - "@serve-tools/signal-event-source"
          - "@serve-tools/signal-http-stream"
          - "@serve-tools/signal-messaging"
          - "@serve-tools/signal-shared-db"
          - "@serve-tools/signal-shared-event-source"
          - "@serve-tools/signal-shared-http-stream"
          - "@serve-tools/signal-shared-websocket"
          - "@serve-tools/signal-shared-webtransport"
          - "@serve-tools/signal-storage"
          - "@serve-tools/signal-websocket"
          - "@serve-tools/signal-webtransport"
          - "@serve-tools/signal"
          - "@serve-tools/signals"
          - "@serve-tools/skills"
          - "@serve-tools/vite-polyfills"
      version:
        description: Exact package.json version; leave empty for all
        required: false
        type: string
      tag:
        description: npm distribution tag
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Plan, verify, and pack
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact: ${{ steps.plan.outputs.artifact }}
      count: ${{ steps.plan.outputs.count }}
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/
      - run: npm install --global npm@12.0.2
      - id: plan
        name: Check release prerequisites
        env:
          RELEASE_DIRECTORY: ${{ runner.temp }}/release
          RELEASE_PACKAGE: ${{ inputs.package }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node scripts/release-plan.mjs
          echo "artifact=release-$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run verify
      - name: Pack release artifacts
        env:
          RELEASE_DIRECTORY: ${{ runner.temp }}/release
        run: node scripts/release-pack.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.plan.outputs.artifact }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    name: Publish ${{ needs.prepare.outputs.count }} package(s)
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/
      - run: npm install --global npm@12.0.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: ${{ runner.temp }}/release
      - name: Verify and publish artifact
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          cd "$RUNNER_TEMP/release"
          sha256sum --check -- *.sha256
          node <<'NODE' > "$RUNNER_TEMP/release-tarballs"
          const plan = require("./release-plan.json");
          if (!plan.length) process.exit(1);
          for (const { tarball } of plan) {
            if (!tarball) process.exit(1);
            console.log(tarball);
          }
          NODE
          while IFS= read -r TARBALL; do
            test -f "$TARBALL"
            npm publish "$TARBALL" --access public --provenance --tag "$RELEASE_TAG"
          done < "$RUNNER_TEMP/release-tarballs"
