<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="SharedWorker-coordinated IndexedDB with live committed changes." />
		<title>@serve-tools/client-shared-db demo</title>
		<link rel="stylesheet" href="./src/style.css" />
	</head>
	<body>
		<main>
			<nav><a href="../../">← All demos</a></nav>
			<p class="eyebrow">@serve-tools/client-shared-db</p>
			<h1>One database coordinator, every tab.</h1>
			<p class="intro">
				Add and edit tasks, then open this page in another tab. Committed IndexedDB changes flow through one
				SharedWorker subscription.
			</p>

			<section>
				<form id="task-form">
					<label for="task-title">New task</label>
					<input
						id="task-title"
						name="title"
						placeholder="Coordinate something"
						autocomplete="off"
						required
					/>
					<button>Add task</button>
				</form>
				<div class="status">
					<span id="connection">Connecting…</span>
					<span>Revision <strong id="revision">0</strong></span>
					<button id="clear" class="secondary" type="button">Clear all</button>
				</div>
				<ul id="tasks"></ul>
				<p id="empty">No tasks yet.</p>
			</section>
		</main>
		<script type="module" src="./src/main.ts"></script>
	</body>
</html>
