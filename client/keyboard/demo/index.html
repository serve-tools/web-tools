<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="Platform-relative keyboard chords from @serve-tools/client-keyboard." />
		<title>@serve-tools/client-keyboard demo</title>
		<link rel="stylesheet" href="./src/style.css" />
	</head>
	<body>
		<main>
			<nav><a href="../../">← All demos</a></nav>
			<p class="eyebrow">@serve-tools/client-keyboard</p>
			<h1>One chord, native to each platform.</h1>
			<p class="intro">
				Focus the capture area and press a shortcut to inspect its canonical form and accessible output.
			</p>

			<section id="capture" tabindex="0" aria-label="Keyboard shortcut capture area">
				<p class="eyebrow">Press keys here</p>
				<div id="symbols" aria-hidden="true"><kbd>⌘</kbd><kbd>K</kbd></div>
				<strong id="label">Waiting for a chord</strong>
				<dl>
					<div>
						<dt>Canonical</dt>
						<dd id="canonical">—</dd>
					</div>
					<div>
						<dt>ARIA</dt>
						<dd id="aria">—</dd>
					</div>
				</dl>
			</section>

			<section class="examples">
				<p class="eyebrow">Try these</p>
				<ul id="shortcuts"></ul>
			</section>
		</main>
		<script type="module" src="./src/main.ts"></script>
	</body>
</html>
