<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Point operations · @serve-tools/client-db</title>
		<link rel="stylesheet" href="./src/style.css" />
	</head>
	<body data-demo="operations">
		<main>
			<nav><a href="./index.html">← All demos</a></nav>
			<p class="eyebrow">Point operations</p>
			<h1>Store typed records</h1>
			<p>Add a contact, then read every contact after its write transaction commits.</p>
			<form>
				<label for="name">Name</label>
				<input id="name" name="name" placeholder="Margaret Hamilton" autocomplete="name" required />
				<label for="email">Email</label>
				<input
					id="email"
					name="email"
					type="email"
					placeholder="margaret@example.com"
					autocomplete="email"
					required
				/>
				<button>Add contact</button>
			</form>
			<div class="actions">
				<button id="reset" class="secondary">Reset demo data</button>
				<button id="clear" class="secondary">Clear demo data</button>
			</div>
			<output aria-live="polite">Opening the database…</output>
		</main>
		<script type="module" src="./src/main.ts"></script>
	</body>
</html>
