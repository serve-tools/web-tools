<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="Browser-mediated interactions with explicit outcomes." />
		<title>@serve-tools/client-interaction demo</title>
		<link rel="stylesheet" href="./src/style.css" />
	</head>
	<body>
		<main>
			<nav><a href="../../">← All demos</a></nav>
			<p class="eyebrow">@serve-tools/client-interaction</p>
			<h1>Ask the browser, keep the outcome.</h1>
			<p class="intro">
				Start each operation directly from a user gesture and see completion, abortion, unsupported APIs, and
				permission failures represented explicitly.
			</p>

			<div class="actions">
				<button id="copy">
					<strong>Copy text</strong>
					<span id="copy-support"></span>
				</button>
				<button id="share">
					<strong>Share this page</strong>
					<span id="share-support"></span>
				</button>
				<button id="files">
					<strong>Choose files</strong>
					<span id="files-support"></span>
				</button>
				<button id="color">
					<strong>Pick a color</strong>
					<span id="color-support"></span>
				</button>
			</div>

			<section>
				<p class="eyebrow">Latest result</p>
				<output aria-live="polite">Choose an interaction above.</output>
			</section>
		</main>
		<script type="module" src="./src/main.ts"></script>
	</body>
</html>
