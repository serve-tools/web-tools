<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="Runnable @serve-tools/lit-signals examples with their TypeScript source." />
		<title>@serve-tools/lit-signals demo</title>
		<link rel="stylesheet" href="./src/style.css" />
	</head>
	<body>
		<main>
			<nav><a href="../../">← All demos</a></nav>
			<p class="eyebrow">@serve-tools/lit-signals</p>
			<h1>Signals ❤️ Lit</h1>
			<p class="intro">
				Five small examples show the update boundary that fits each job. Open any source panel to see the exact
				TypeScript running beside it.
			</p>

			<div class="examples">
				<code-example
					id="counter-example"
					data-title="Update one template part"
					data-description="Pass Signals directly to html, or use when() for a tracked branch. The component renders once while its parts keep changing."
				>
					<signal-counter></signal-counter>
				</code-example>

				<code-example
					id="operation-example"
					data-title="Share an asynchronous operation"
					data-description="@operation connects an element accessor to one ambient subscriber view without taking ownership of the shared operation."
				>
					<signal-progress></signal-progress>
				</code-example>

				<code-example
					id="collections-example"
					data-title="Keep a keyed list reactive"
					data-description="Wrap a normal array with @collection and hand it to repeat(). Native mutations reconcile stable keyed rows."
				>
					<signal-task-list></signal-task-list>
				</code-example>

				<code-example
					id="context-example"
					data-title="Share context as plain values"
					data-description="A provider assigns ordinary values. A subscribing consumer follows them through signal-backed accessors."
				>
					<signal-theme-provider>
						<signal-theme-consumer></signal-theme-consumer>
					</signal-theme-provider>
				</code-example>

				<code-example
					id="styles-example"
					data-title="Drive DOM and CSS independently"
					data-description="@property and @computed feed fine-grained template bindings while @style updates one host declaration."
				>
					<signal-color-picker></signal-color-picker>
				</code-example>
			</div>
		</main>
		<script type="module" src="./src/main.ts"></script>
	</body>
</html>
